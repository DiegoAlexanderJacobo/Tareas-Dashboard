<div class="bg-white rounded-2xl shadow-xl w-[90vw] sm:w-[500px] max-h-[90vh] overflow-y-auto flex flex-col font-sans relative">
    
    <!-- Botones de Acción (Modo Vista) -->
    <div *ngIf="mode === 'view'" class="absolute top-4 right-4 flex gap-2 z-10">
        <button type="button" (click)="enableEdit()" title="Editar"
                class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
            </svg>
        </button>
        <button type="button" (click)="deleteRequirement()" title="Eliminar"
                class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-full transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
        </button>
        <!-- Close button if just viewing without edit -->
        <button type="button" (click)="cancel()" title="Cerrar"
                class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-full transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>

    <!-- Título del Modal -->
    <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-xl font-bold text-slate-800 tracking-tight">
            {{ mode === 'create' ? 'Nuevo Requerimiento' : (mode === 'edit' ? 'Editar Requerimiento' : 'Detalle del Requerimiento') }}
        </h2>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col p-6 gap-5">
        
        <!-- Metadata (solo visible en Edit/View) -->
        <div *ngIf="mode !== 'create'" class="grid grid-cols-3 gap-4 pb-4 border-b border-slate-50 mb-2">
            <div class="flex flex-col">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">ID</label>
                <input type="text" formControlName="id" class="text-xs text-slate-500 bg-transparent border-none p-0 focus:ring-0">
            </div>
            <div class="flex flex-col">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">Creado</label>
                <input type="text" formControlName="createdAt" class="text-xs text-slate-500 bg-transparent border-none p-0 focus:ring-0">
            </div>
            <div class="flex flex-col">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">Modificado</label>
                <input type="text" formControlName="modifiedAt" class="text-xs text-slate-500 bg-transparent border-none p-0 focus:ring-0">
            </div>
        </div>

        <!-- Título -->
        <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-slate-700">Título <span *ngIf="mode !== 'view'" class="text-rose-500">*</span></label>
            <input type="text" formControlName="title" placeholder="Ej: Implementar Login"
                class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow disabled:bg-slate-50 disabled:text-slate-500 disabled:border-transparent">
            <span *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="text-xs text-rose-500 mt-0.5">El título es obligatorio.</span>
        </div>

        <!-- Descripción -->
        <div class="flex flex-col gap-1.5">
            <label class="text-sm font-semibold text-slate-700">Descripción</label>
            <textarea formControlName="description" rows="3" placeholder="Detalles adicionales del requerimiento..."
                class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow resize-none disabled:bg-slate-50 disabled:text-slate-500 disabled:border-transparent"></textarea>
        </div>

        <!-- Fila: Estado y Prioridad -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-semibold text-slate-700">Estado <span *ngIf="mode !== 'view'" class="text-rose-500">*</span></label>
                <select formControlName="status"
                    class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow disabled:bg-slate-50 disabled:text-slate-500 disabled:border-transparent disabled:appearance-none">
                    <option value="Pendiente">Pendiente</option>
                    <option value="En Proceso">En Proceso</option>
                </select>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-semibold text-slate-700">Prioridad <span *ngIf="mode !== 'view'" class="text-rose-500">*</span></label>
                <select formControlName="priority"
                    class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow disabled:bg-slate-50 disabled:text-slate-500 disabled:border-transparent disabled:appearance-none">
                    <option value="Alta">Alta</option>
                    <option value="Media">Media</option>
                    <option value="Baja">Baja</option>
                </select>
            </div>
        </div>

        <!-- Fila: Asignado y Fecha -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-semibold text-slate-700">Asignado a <span *ngIf="mode !== 'view'" class="text-rose-500">*</span></label>
                <input type="text" formControlName="assignee" placeholder="Ej: Diego"
                    class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow disabled:bg-slate-50 disabled:text-slate-500 disabled:border-transparent">
                <span *ngIf="form.get('assignee')?.invalid && form.get('assignee')?.touched" class="text-xs text-rose-500 mt-0.5">Asignado es obligatorio.</span>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-semibold text-slate-700">Fecha de Vencimiento</label>
                <input type="date" formControlName="dueDate" [min]="minDate" max="9999-12-31"
                    class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow disabled:bg-slate-50 disabled:text-slate-500 disabled:border-transparent">
                <span *ngIf="form.get('dueDate')?.hasError('pastDate') && form.get('dueDate')?.touched" class="text-xs text-rose-500 mt-0.5">Fecha pasada</span>
            </div>
        </div>

        <!-- Footer / Botones -->
        <div *ngIf="mode !== 'view'" class="mt-4 pt-4 border-t border-slate-100 flex justify-end gap-3">
            <button type="button" (click)="cancel()"
                class="px-5 py-2 rounded-lg font-medium text-slate-600 hover:text-slate-800 hover:bg-slate-100 transition-colors">
                Cancelar
            </button>
            <button type="submit" [disabled]="form.invalid"
                class="px-5 py-2 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm shadow-indigo-200 transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
                {{ mode === 'create' ? 'Guardar' : 'Guardar Cambios' }}
            </button>
        </div>

    </form>
</div>
